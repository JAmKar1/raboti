{% extends 'base.html' %}
{% block content %}
<h3>{{ 'Редактировать' if item else 'Добавить технику' }}</h3>
<form method="post" class="row g-3">
  <div class="col-md-4"><label class="form-label">Инв. номер *</label>
    <input name="inv_number" class="form-control" required value="{{ item.inv_number if item else '' }}"></div>
  <div class="col-md-8"><label class="form-label">Наименование *</label>
    <input name="name" class="form-control" required value="{{ item.name if item else '' }}"></div>

  <div class="col-md-4"><label class="form-label">Тип</label>
    <select name="type_id" class="form-select">
      <option value="">—</option>
      {% for t in types %}
      <option value="{{ t.id }}" {% if item and item.type_id == t.id %}selected{% endif %}>{{ t.name }}</option>
      {% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Модель</label>
    <input name="model" class="form-control" value="{{ item.model or '' if item else '' }}"></div>
  <div class="col-md-4"><label class="form-label">Серийный №</label>
    <input name="serial_number" class="form-control" value="{{ item.serial_number or '' if item else '' }}"></div>

  <div class="col-md-4"><label class="form-label">Статус</label>
    <select name="status" class="form-select">
      {% for s in ['в эксплуатации','на ремонте','списано'] %}
      <option {% if item and item.status == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Кабинет</label>
    <select name="location_id" class="form-select">
      <option value="">—</option>
      {% for l in locations %}
      <option value="{{ l.id }}" {% if item and item.location_id == l.id %}selected{% endif %}>{{ l.number }} ({{ l.building }})</option>
      {% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Ответственный</label>
    <select name="employee_id" class="form-select">
      <option value="">—</option>
      {% for e in employees %}
      <option value="{{ e.id }}" {% if item and item.employee_id == e.id %}selected{% endif %}>{{ e.full_name }}</option>
      {% endfor %}
    </select></div>

  <div class="col-md-4"><label class="form-label">Дата покупки</label>
    <input type="date" name="purchase_date" class="form-control"
           value="{{ item.purchase_date if item and item.purchase_date else '' }}"></div>
  <div class="col-md-4"><label class="form-label">Стоимость, ₽</label>
    <input type="number" step="0.01" name="cost" class="form-control" value="{{ item.cost or '' if item else '' }}"></div>

  <div class="col-12"><label class="form-label">Примечание</label>
    <textarea name="note" class="form-control" rows="2">{{ item.note or '' if item else '' }}</textarea></div>

  <div class="col-12">
    <button class="btn btn-primary">Сохранить</button>
    <a class="btn btn-secondary" href="{{ url_for('equipment_list') }}">Отмена</a>
  </div>
</form>
{% endblock %}
