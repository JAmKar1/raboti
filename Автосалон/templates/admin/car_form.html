{% extends 'base.html' %}
{% block title %}{{ 'Редактирование' if action=='edit' else 'Новый автомобиль' }} — админ{% endblock %}
{% block content %}
<section class="page-head">
  <div class="container">
    <h1>{{ 'Редактирование' if action=='edit' else 'Новый автомобиль' }}</h1>
  </div>
</section>
<section class="section">
  <div class="container">
    <form method="post" class="panel form--grid">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="field"><label>Марка</label><input name="brand" value="{{ (car['brand'] if car else '') }}" required>
      </div>
      <div class="field"><label>Модель</label><input name="model" value="{{ (car['model'] if car else '') }}" required>
      </div>
      <div class="field"><label>Год</label><input name="year" type="number"
          value="{{ (car['year'] if car else 2024) }}"></div>
      <div class="field"><label>Цена, ₽</label><input name="price" type="number"
          value="{{ (car['price'] if car else 0) }}"></div>
      <div class="field"><label>Пробег, км</label><input name="mileage" type="number"
          value="{{ (car['mileage'] if car else 0) }}"></div>
      <div class="field"><label>Мощность, л.с.</label><input name="power" type="number"
          value="{{ (car['power'] if car else 0) }}"></div>
      <div class="field"><label>Кузов</label><input name="body" value="{{ (car['body'] if car else 'Седан') }}"></div>
      <div class="field"><label>Топливо</label><input name="fuel" value="{{ (car['fuel'] if car else 'Бензин') }}">
      </div>
      <div class="field"><label>Коробка</label><input name="transmission"
          value="{{ (car['transmission'] if car else 'Автомат') }}"></div>
      <div class="field"><label>Состояние</label><input name="condition"
          value="{{ (car['condition'] if car else 'С пробегом') }}"></div>
      <div class="field"><label>Двигатель</label><input name="engine" value="{{ (car['engine'] if car else '') }}">
      </div>
      <div class="field"><label>Привод</label><input name="drive" value="{{ (car['drive'] if car else '') }}"></div>
      <div class="field"><label>Страна</label><input name="country" value="{{ (car['country'] if car else '') }}"></div>
      <div class="field"><label>Цвет</label><input name="color" value="{{ (car['color'] if car else '') }}"></div>
      <div class="field"><label>VIN</label><input name="vin" value="{{ (car['vin'] if car else '') }}"></div>
      <div class="field"><label>Комплектации (через запятую)</label><input name="features"
          value="{{ (car['features'] | join(', ')) if car else '' }}"></div>
      <div class="field field--wide"><label>Описание</label><textarea name="description"
          rows="4">{{ (car['description'] if car else '') }}</textarea></div>
      <button class="btn btn--primary btn--lg">Сохранить</button>
    </form>
  </div>
</section>
{% endblock %}
